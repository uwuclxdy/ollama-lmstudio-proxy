[package]
name = "ollama-lmstudio-proxy"
version = "1.8.0"
edition = "2024"
rust-version = "1.89"
authors = ["uwuclxdy"]
description = "Blazingly fast proxy server that bridges Ollama and LM Studio"
license = "MIT OR Apache-2.0"
repository = "https://github.com/uwuclxdy/ollama-lmstudio-proxy"
keywords = ["ollama", "lmstudio", "proxy", "llm", "ai"]
categories = ["network-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
tokio-stream = "0.1.19"
axum = { version = "0.8.9", features = ["macros"] }
tower-http = { version = "0.7.1", features = ["cors"] }
http = "1.5.0"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
futures-util = "0.3.34"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
log = "0.4.34"
fern = "0.7.1"
moka = { version = "0.12.16", features = ["future"] }
sha2 = "0.11.1"
subtle = "2"
md5 = "0.8.1"
hex = "0.4.3"
url = "2.5.8"
humantime = "2.4.0"
htmd = "0.5.6"
update-informer = { version = "1.3.0", default-features = false, features = ["github"] }
base64 = "0.23.1"

[dev-dependencies]
wiremock = "0.6.5"
tempfile = "3.27.0"
http-body-util = "0.1.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.dev]
opt-level = 1
