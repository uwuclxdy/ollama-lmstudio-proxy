# cargo-deny: license + advisory + source checks. CI runs `cargo deny check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound advisories are always denied in this cargo-deny
# schema; tune coverage here and silence specific ones via `ignore`.
# `workspace` scope: flag unmaintained crates we depend on directly, not
# deep transitives we can't control.
yanked       = "deny"
unmaintained = "workspace"
ignore       = [
  # 2026-11-17: both crates are unmaintained across every version and offer no
  # upgrade (humantime wraps chrono); the swap is tracked in the local
  # punch-list, and the gate keeps guarding every other advisory.
  "RUSTSEC-2026-0543",
  "RUSTSEC-2026-0542",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
