# cargo-deny: license + advisory + source checks. CI runs `cargo deny check`.

[graph]
all-features = true

[advisories]
# Vulnerabilities and unsound advisories are always denied in this cargo-deny
# schema; tune coverage here and silence specific ones via `ignore`.
# `workspace` scope: flag unmaintained crates we depend on directly, not
# deep transitives we can't control.
yanked       = "deny"
unmaintained = "workspace"
ignore       = []

[licenses]
allow = [
  "MIT",
  "MITNFA",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards         = "deny"
deny              = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
