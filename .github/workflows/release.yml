name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release page exists the moment the tag lands; notes are NOT auto-generated
  # (the release script writes them), assets attach as each native build finishes.
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false

  build:
    name: Build ${{ matrix.artifact }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ollama-lmstudio-proxy-linux-x64
            binary: ollama-lmstudio-proxy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ollama-lmstudio-proxy-windows-x64.exe
            binary: ollama-lmstudio-proxy.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ollama-lmstudio-proxy-macos-arm64
            binary: ollama-lmstudio-proxy

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage artifact
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.artifact }}"
          if [ "${{ runner.os }}" != "Windows" ] && [[ "${{ matrix.artifact }}" != *.exe ]]; then
            chmod +x "release/${{ matrix.artifact }}"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: release/${{ matrix.artifact }}

      - name: Upload artifact for checksum job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [build]
    # Run even if one build leg failed so the sums file always matches exactly
    # what shipped in a partial release.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate sha256sums.txt
        run: |
          cd artifacts
          sha256sum ollama-lmstudio-proxy-* > ../sha256sums.txt
      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@v3
        with:
          files: sha256sums.txt
