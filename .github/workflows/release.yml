name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # softprops/action-gh-release creates the release
  id-token: write      # GitHub OIDC — keyless build-provenance attestation (optional)
  attestations: write  # actions/attest-build-provenance (optional)

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag is semver
        # Tightens the `v*` trigger to strict vX.Y.Z — a malformed tag otherwise
        # mints a broken Release page. Pre-release suffixes (`v1.2.3-rc1`) need
        # the regex relaxed.
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '${GITHUB_REF_NAME}' is not vX.Y.Z"; exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: false

  build:
    name: Build ${{ matrix.artifact }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash  # windows-latest ships Git Bash; keeps cp + forward-slash paths uniform across OSes
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ollama-lmstudio-proxy-linux-x64
            binary: ollama-lmstudio-proxy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ollama-lmstudio-proxy-windows-x64.exe
            binary: ollama-lmstudio-proxy.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ollama-lmstudio-proxy-macos-arm64
            binary: ollama-lmstudio-proxy
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "release/${{ matrix.artifact }}"
          if [ "${{ runner.os }}" != "Windows" ] && [[ "${{ matrix.artifact }}" != *.exe ]]; then
            chmod +x "release/${{ matrix.artifact }}"
          fi
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: release/${{ matrix.artifact }}
      - name: Attest build provenance   # optional supply-chain: keyless SLSA provenance for the asset
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/${{ matrix.artifact }}
      - name: Upload artifact for checksum job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: [build]
    # Run even when a build leg fails so the binaries that DID ship always have a
    # matching sums file covering exactly what was published.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate sha256sums.txt
        # Glob whatever was actually built so a partial release still produces a
        # sums file matching exactly what shipped.
        run: |
          cd artifacts
          sha256sum ollama-lmstudio-proxy-* > ../sha256sums.txt
      - name: Upload sha256sums.txt to release
        uses: softprops/action-gh-release@v3
        with:
          files: sha256sums.txt
