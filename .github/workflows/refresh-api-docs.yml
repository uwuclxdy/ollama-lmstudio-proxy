name: refresh api docs

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run refresh script
        run: ./scripts/refresh-api-docs.sh

      - name: Detect changes
        id: diff
        run: |
          mapfile -t rows < <(git diff --numstat -- api-docs/)
          if [[ ${#rows[@]} -eq 0 ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no upstream changes"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          active=0; arows=""; frows=""
          for row in "${rows[@]}"; do
            IFS=$'\t' read -r add del path <<<"$row"
            rel=${path#api-docs/}
            if [[ $rel == future/* ]]; then
              frows+=$'\n'"| \`$rel\` | future | +$add / -$del |"
            else
              arows+=$'\n'"| \`$rel\` | active | +$add / -$del |"
              active=$((active + 1))
            fi
          done
          table=$'| doc | scope | +/- |\n|---|---|---|'"$arows$frows"

          [[ $active -gt 0 ]] && echo "active=true" >> "$GITHUB_OUTPUT" \
                              || echo "active=false" >> "$GITHUB_OUTPUT"
          {
            echo "body<<__PR_BODY__"
            if [[ $active -gt 0 ]]; then
              echo "$active proxy-backed doc(s) changed upstream. Review the shape deltas and patch the matching handler before merging."
            else
              echo "Only \`future/\` mirrors changed. Nothing the proxy implements today moved, so this refresh is informational."
            fi
            echo
            echo "$table"
            echo
            echo "Generated by \`.github/workflows/refresh-api-docs.yml\`."
            echo "__PR_BODY__"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-api-docs
          commit-message: |
            docs(api): refresh ollama and lm studio reference snapshots

            Automated sync via scripts/refresh-api-docs.sh.
          title: >-
            docs(api): refresh mirrors${{ steps.diff.outputs.active == 'true' && ' (active docs changed)' || ' (future-only)' }}
          body: ${{ steps.diff.outputs.body }}
          add-paths: |
            api-docs/**
          delete-branch: true
